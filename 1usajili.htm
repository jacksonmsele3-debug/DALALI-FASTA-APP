<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usajili - Dalali Fasta</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --primary-color: #2563eb; --primary-hover: #1d4ed8; --accent-color: #10b981; --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); --card-bg: #ffffff; --text-main: #1e293b; --text-muted: #64748b; --border-color: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg-gradient); padding: 20px; }
    .container { background: var(--card-bg); border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); width: 100%; max-width: 440px; padding: 35px 30px; }
    .brand-header { text-align: center; margin-bottom: 25px; }
    .brand-header h1 { font-size: 28px; font-weight: 700; color: var(--primary-color); }
    .brand-header h1 span { color: var(--accent-color); }
    .brand-header p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 13px; color: var(--text-main); }
    .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border-color); border-radius: 8px; font-size: 14px; outline: none; background-color: #f8fafc; }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary-color); background-color: #ffffff; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); }
    .btn { width: 100%; padding: 13px; background-color: var(--primary-color); color: #ffffff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; margin-top: 8px; }
    .btn:hover { background-color: var(--primary-hover); }
    .msg { margin-top: 18px; padding: 12px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: 500; display: none; word-break: break-all; }
    .msg.error { background-color: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: block; }
    .msg.success { background-color: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; display: block; }
    .msg.info { background-color: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; display: block; }
    .footer-text { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
    .footer-text a { color: var(--primary-color); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-header">
      <h1>DALALI<span>FASTA</span></h1>
      <p id="form-subtitle">Usajili rasmi na Uthibitisho wa OTP</p>
    </div>

    <!-- FOMU YA USAJILI -->
    <form id="register-form" onsubmit="handleSupabaseSignUp(event)">
      <div class="form-group"><label for="fullname">Jina Kamili</label><input type="text" id="fullname" placeholder="Mfano: Juma Ally" required></div>
      <div class="form-group"><label for="phone">Namba ya Simu</label><input type="tel" id="phone" placeholder="07XXXXXXXX" required></div>
      <div class="form-group"><label for="email">Barua Pepe (Email)</label><input type="email" id="email" placeholder="mfano@gmail.com" required></div>
      <div class="form-group"><label for="password">Neno la Siri (Password)</label><input type="password" id="password" placeholder="••••••••" minlength="6" required></div>
      <div class="form-group">
        <label for="role">Aina ya Akaunti</label>
        <select id="role" required>
          <option value="mteja">Mteja (Anayetafuta Nyumba)</option>
          <option value="dalali">Dalali / Mpangishaji</option>
        </select>
      </div>
      <button type="submit" id="btn-submit" class="btn">Sajili na Tuma OTP</button>
    </form>

    <!-- FOMU YA KUTHIBITISHA OTP -->
    <form id="otp-form" style="display: none;" onsubmit="verifySupabaseOTP(event)">
      <div class="form-group">
        <label for="otp-code">Weka Namba ya Uthibitisho (OTP)</label>
        <input type="text" id="otp-code" placeholder="Weka tarakimu zilizotumwa kwenye email" required style="text-align: center; font-size: 18px; letter-spacing: 3px;">
      </div>
      <button type="submit" id="btn-verify" class="btn" style="background-color: var(--accent-color);">Thibitisha na Maliza</button>
    </form>

    <div id="msg-box" class="msg"></div>
    <div class="footer-text">Unayo akaunti tayari? <a href="igia.html">Ingia Hapa</a></div>
  </div>

  <script>
    const SUPABASE_URL = "https://xtczpelcjahljxhkjeoj.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_Yf1ONcdgIFAamD9w7arlkg_tM0URb5e";
    const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function showMessage(text, type) {
      const msgBox = document.getElementById('msg-box');
      msgBox.className = 'msg ' + type;
      msgBox.innerText = text;
    }

    async function handleSupabaseSignUp(event) {
      event.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      showMessage('Inatuma ombi la usajili na OTP...', 'info');

      const fullname = document.getElementById('fullname').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;

      const { data, error } = await _supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: fullname,
            phone: phone,
            role: role
          }
        }
      });

      if (error) {
        console.error("Supabase Error:", error);
        let errorMsg = error.message;
        if (!errorMsg || errorMsg === "") {
          errorMsg = JSON.stringify(error);
        }
        showMessage('Kosa la Usajili: ' + errorMsg, 'error');
        btn.disabled = false;
        return;
      }

      document.getElementById('register-form').style.display = 'none';
      document.getElementById('otp-form').style.display = 'block';
      document.getElementById('form-subtitle').innerText = 'Weka namba ya OTP iliyotumwa kwenye Email yako';
      
      showMessage('Success! Angalia barua pepe yako kwa ajili ya namba ya uthibitisho (OTP).', 'success');
      btn.disabled = false;
    }

    async function verifySupabaseOTP(event) {
      event.preventDefault();
      const btnVerify = document.getElementById('btn-verify');
      btnVerify.disabled = true;
      showMessage('Inahakiki OTP yako...', 'info');

      const email = document.getElementById('email').value.trim();
      const token = document.getElementById('otp-code').value.trim();

      const { data, error } = await _supabase.auth.verifyOtp({
        email: email,
        token: token,
        type: 'signup'
      });

      if (error) {
        console.error("Verification Error:", error);
        showMessage('Kosa: OTP si sahihi au muda wake umeisha. ' + (error.message || JSON.stringify(error)), 'error');
        btnVerify.disabled = false;
        return;
      }

      showMessage('🎉 Usajili umekamilika na data zimehifadhiwa! Inakuelekeza kwenye Dashboard...', 'success');
      setTimeout(() => { 
        window.location.href = 'dashboard-dalali.htm'; 
      }, 2000);
    }
  </script>
</body>
</html>
