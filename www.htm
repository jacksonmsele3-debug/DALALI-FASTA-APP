<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dalali Fasta | Dashibodi & Weka Video</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #10B981;
            --primary-glow: rgba(16, 185, 129, 0.4);
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.15);
            --bg-dark: #030712;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            background: radial-gradient(circle at top, #0F172A 0%, var(--bg-dark) 100%);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
        }
        /* Kadi ya Muda wa Kifurushi */
        .subscription-card {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(16px);
        }
        .sub-info { display: flex; align-items: center; gap: 14px; }
        .sub-icon { padding: 12px; background: rgba(99, 102, 241, 0.1); color: #818CF8; border-radius: 14px; }
        .sub-title { font-size: 0.75rem; text-transform: uppercase; font-weight: 700; color: #94A3B8; }
        .sub-days { font-size: 1.2rem; font-weight: 800; color: #F8FAFC; margin-top: 2px; }
        .sub-phone { font-size: 0.75rem; color: #64748B; margin-top: 2px; }
        .btn-topup {
            background: #4F46E5;
            color: #fff;
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 10px 16px;
            border-radius: 10px;
            transition: 0.3s;
        }
        .btn-topup:hover { background: #4338CA; }

        /* Form Card */
        .form-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: blur(16px);
        }
        .form-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 20px; color: var(--primary); display: flex; gap: 10px; align-items: center; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; color: #CBD5E1; margin-bottom: 6px; }
        .form-control {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border);
            padding: 12px 16px; border-radius: 12px; color: #fff; outline: none;
        }
        .btn-submit {
            width: 100%; background: var(--primary); color: white; border: none; padding: 14px;
            border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 1rem; margin-top: 10px;
            box-shadow: 0 4px 15px var(--primary-glow);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- KADI YA SIKU ZILIZOBAKI KIOTOMATIKI -->
        <div class="subscription-card">
            <div class="sub-info">
                <div class="sub-icon">
                    <i class="fa-solid fa-calendar-days text-xl"></i>
                </div>
                <div>
                    <div class="sub-title">Muda wa Kifurushi</div>
                    <div id="daysLeftText" class="sub-days">Inasoma...</div>
                    <div id="payerPhoneText" class="sub-phone">Namba: --</div>
                </div>
            </div>
            <div>
                <a href="payment.htm" class="btn-topup">Ongeza Muda</a>
            </div>
        </div>

        <!-- FORM YA KUWEKA VIDEO -->
        <div class="form-card">
            <div class="form-title"><i class="fa-solid fa-cloud-arrow-up"></i> Weka Video Mpya</div>
            <form id="uploadForm" onsubmit="hifadhiVideoSupabase(event)">
                <div class="form-group">
                    <label>Faili la Video</label>
                    <input type="file" id="videoFile" class="form-control" accept="video/*" required>
                </div>
                <div class="form-group">
                    <label>Kichwa cha Nyumba / Maelezo</label>
                    <input type="text" id="kichwaInput" class="form-control" placeholder="Mf. Nyumba ya Kifahari vyumba 4" required>
                </div>
                <div class="form-group">
                    <label>Eneo / Mahali</label>
                    <input type="text" id="eneoInput" class="form-control" placeholder="Mf. Masaki, Dar es Salaam" required>
                </div>
                <div class="form-group">
                    <label>Bei (Tsh)</label>
                    <input type="number" id="beiInput" class="form-control" placeholder="Mf. 1200000" required>
                </div>
                <button type="submit" id="btn-submit-post" class="btn-submit">Pakia Video Sasa</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://xtczpelcjahljxhkjeoj.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Yf1ONcdgIFAamD9w7arlkg_tM0URb5e";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // 1. FUNCTION YA KUSOMA SIKU KUTOKA SUPABASE VIEW (vw_dalali_days)
        async function somaSikuZaDalali() {
            try {
                const { data: { user } } = await supabaseClient.auth.getUser();
                let userId = user ? user.id : null;

                if (!userId) {
                    const localUser = JSON.parse(localStorage.getItem('dalali_user'));
                    if (localUser) userId = localUser.id;
                }

                if (!userId) {
                    document.getElementById('daysLeftText').innerText = "Hujaingia Akaunti";
                    return;
                }

                const { data, error } = await supabaseClient
                    .from('vw_dalali_days')
                    .select('days_left, payment_status, phone_number, plan')
                    .eq('user_id', userId)
                    .maybeSingle();

                if (error) {
                    console.error("Kosa:", error.message);
                    document.getElementById('daysLeftText').innerText = "Error Kusoma Data";
                    return;
                }

                if (!data) {
                    document.getElementById('daysLeftText').innerText = "Hujalipia Kifurushi";
                    document.getElementById('daysLeftText').style.color = "#F59E0B";
                    document.getElementById('payerPhoneText').innerText = "Lipia ili kuanza huduma";
                    return;
                }

                const daysLeft = data.days_left || 0;
                const phone = data.phone_number || "---";

                if (data.payment_status === 'ACTIVE' && daysLeft > 0) {
                    document.getElementById('daysLeftText').innerText = `Zimebaki Siku ${daysLeft}`;
                    document.getElementById('daysLeftText').style.color = "#10B981";
                    document.getElementById('payerPhoneText').innerText = `Namba: ${phone} (${data.plan ? data.plan.toUpperCase() : ''})`;
                } else {
                    document.getElementById('daysLeftText').innerText = "Kifurushi Kimeisha";
                    document.getElementById('daysLeftText').style.color = "#EF4444";
                    document.getElementById('payerPhoneText').innerText = `Namba: ${phone}`;
                }

            } catch (err) {
                console.error("Hitilafu:", err);
            }
        }

        // 2. FUNCTION YA KUHIFADHI VIDEO
        async function hifadhiVideoSupabase(event) {
            event.preventDefault();
            const fileInput = document.getElementById("videoFile");
            const file = fileInput.files[0];
            const btn = document.getElementById("btn-submit-post");

            if (!file) return;

            btn.disabled = true;
            btn.innerHTML = "<i class='fa-solid fa-spinner fa-spin'></i> Inapakia...";

            try {
                const fileName = `video_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

                const { data: storageData, error: storageError } = await supabaseClient
                    .storage
                    .from('nyumba_videos')
                    .upload(fileName, file, { cacheControl: '3600', upsert: false });

                if (storageError) throw storageError;

                const { data: urlData } = supabaseClient
                    .storage
                    .from('nyumba_videos')
                    .getPublicUrl(fileName);

                const publicUrl = urlData.publicUrl;

                const { error: dbError } = await supabaseClient
                    .from('videos')
                    .insert([{
                        video_url: publicUrl,
                        kichwa: document.getElementById("kichwaInput").value,
                        eneo: document.getElementById("eneoInput").value,
                        bei: parseFloat(document.getElementById("beiInput").value) || 0
                    }]);

                if (dbError) throw dbError;

                alert("Hongera! Video imehifadhiwa vizuri!");
                document.getElementById("uploadForm").reset();
                window.location.href = "video.html";

            } catch (err) {
                alert("Hitilafu: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = "Pakia Video Sasa";
            }
        }

        // Ita function ya kusoma siku pindi ukurasa unapofunguka
        document.addEventListener('DOMContentLoaded', somaSikuZaDalali);
    </script>
</body>
</html>
